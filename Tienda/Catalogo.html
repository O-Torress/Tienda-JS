<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Pointer</title>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
 <header>
  <nav class="flex dark:bg-gray-800 py-3 rounded-lg">
      <div class="flex items-center justify-start ml-5 mt-1 w-full">
        <h1  class="text-2xl font-bold text-gray-900 dark:text-white text-center">Pointer</h1>
        <img src="../Svg/pointer.svg" alt="Pointer svg" width="40" height="40">
      </div>
    <div class="mr-5 mt-2">
      <ul>
        
        <li class="relative active:scale-105 transition-transform 
        bg-green-600 cursor-pointer rounded-lg font-semibold 
        text-white py-2 px-2 w-25 group/dropdown">
          
          <label class="cursor-pointer w-full flex justify-center items-center gap-2 py-1">
            <span 
            id="Btnusuario" >
          </span>
          <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
          fill="#ffffff" viewBox="0 0 24 24" class="group-has-checked/dropdown:rotate-90 transition-transform" >
          <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
          <path d="m9.71 17.71 5.7-5.71-5.7-5.71-1.42 1.42 4.3 4.29-4.3 4.29z"></path>
          </svg>
          <input type="checkbox" class="hidden">
          </label> 
          
          <ul class="absolute top-[calc(100%+20px)] w-40 
          right-0 bg-green-600 rounded-2xl p-3 opacity-0 
          pointer-events-none
          
          group-has-checked/dropdown:opacity-100 
          group-has-checked/dropdown:pointer-events-auto
          transition-opacity
          ">
            <a href="Usuarios.html">
              <li class="flex gap-2 hover:bg-green-900/80 p-2 rounded-xl">
              <img src="../Svg/User.svg" alt="">
              <span  class="text-white">Perfil</span>
            </li>
            </a>
           
            <a href="Admin.html">
              <li class="flex gap-2 hover:bg-green-900/80 p-2 rounded-xl">
              <img src="../Svg/Admin.svg" alt="">
              <span class="text-white">Admin</span>
            </li>
            </a>
            
            <a href="Login.html">
              <li class="flex gap-2 hover:bg-red-900 p-2 rounded-xl">
              <img src="../Svg/Logout.svg" alt="">
              <span id="salir" class="text-white">Salir</span>
            </li>
            </a>
            

          </ul>
        
        </li>
      
      </ul>
    </div>
  </nav>
 </header>
  <section>
    <h1 class="text-3xl font-bold mt-4 ml-5 text-green-600">Catálogo</h1>
  </section>

 <section id="catalogo" class="grid grid-cols-1 md:grid-cols-3 pt-5 gap-7 ml-3 mr-3">

  </section>

  <script>
    const userData = localStorage.getItem('currentUser');

      if (userData) {
        const user = JSON.parse(userData);
        
        const greeting = document.getElementById('Btnusuario');
        greeting.textContent = `${user.name}`;
      }

      const logoutLink = document.getElementById('salir');
      if (logoutLink) {
        logoutLink.addEventListener('click', () => {
          localStorage.removeItem('currentUser');
        });
      }

        let productos = JSON.parse(localStorage.getItem('productos')) || [];

  // Productos por defecto
  if (productos.length === 0) {

    productos = [
      {
        id: 1,
        nombre: "Laptop Gamer",
        precio: 1200,
        descripcion: "Laptop RTX 4060",
        imagen: "https://ddtech.mx/assets/uploads/cf14cd05c57e26d74e5d91e3d938c898.png"
      },

      {
        id: 2,
        nombre: "Mouse Logitech",
        precio: 50,
        descripcion: "Mouse inalámbrico",
        imagen: "https://resource.logitech.com/w_692,c_lpad,ar_4:3,q_auto,f_auto,dpr_1.0/d_transparent.gif/content/dam/logitech/en/products/mice/mx-master-3s-business-wireless-mouse/gallery/mx-master-3s-for-business-gallery-1.png?v=1"
      },

      {
        id: 3,
        nombre: "Teclado Mecánico",
        precio: 80,
        descripcion: "Switch Blue",
        imagen: "https://promart.vteximg.com.br/arquivos/ids/7479097-1000-1000/image-9af968446b50480fade90869c612e40f.jpg?v=638305829355370000"
      }
    ];

    localStorage.setItem('productos', JSON.stringify(productos));
  }

  const catalogo = document.getElementById('catalogo');

  productos.forEach(producto => {

    catalogo.innerHTML += `
    
      <a href="Producto.html?id=${producto.id}">
      
        <div class="bg-[#BFC6C4] rounded-xl p-5">

          <img 
            src="${producto.imagen}" 
            class="w-full h-52 object-cover rounded-lg"
          >

          <h2 class="text-2xl font-bold mt-3">
            ${producto.nombre}
          </h2>

          <p class="mt-2">
            ${producto.descripcion}
          </p>

          <p class="text-green-700 font-bold mt-3">
            $${producto.precio}
          </p>

        </div>

      </a>
    `;
  });
    
  </script>
</body>
</html>
